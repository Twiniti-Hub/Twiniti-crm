  - type: web
    name: twiniti-crm-prod-landing
    runtime: static
    branch: production
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @twiniti/landing build
    staticPublishPath: apps/landing/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_URL
        value: https://twiniti-crm-prod-us.onrender.com
      - key: VITE_APP_URL_US
        value: https://loop.us.twiniti.ai
      - key: VITE_APP_URL_EU
        value: https://loop.eu.twiniti.ai
      - key: VITE_APP_URL_UK
        value: https://loop.uk.twiniti.ai
      - key: VITE_ENVIRONMENT_LABEL
        value: Production
      - key: VITE_GOOGLE_ANALYTICS_ID
        sync: false

