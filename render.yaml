        value: production
      - key: DEPLOYMENT_ENV
        value: development
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: REGIONAL_WEBHOOK_URL_US
        value: https://twiniti-crm-dev-us.onrender.com/api/v1/webhooks/stripe
      - key: REGIONAL_WEBHOOK_URL_EU
        value: https://twiniti-crm-dev-eu.onrender.com/api/v1/webhooks/stripe
      - key: REGIONAL_WEBHOOK_URL_UK
        value: https://twiniti-crm-dev-uk.onrender.com/api/v1/webhooks/stripe
      - key: GATEWAY_FORWARD_TIMEOUT_MS
        value: "10000"

