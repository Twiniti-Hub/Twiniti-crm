  - type: web
    name: twiniti-crm-dev-landing
    runtime: static
    branch: development
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @twiniti/landing build
    staticPublishPath: apps/landing/dist
    headers:
      - path: /robots.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /sitemap.xml
        name: Content-Type
        value: application/xml; charset=utf-8
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_URL_US
        value: https://twiniti-crm-dev-us.onrender.com
      - key: VITE_APP_URL_EU
        value: https://twiniti-crm-dev-eu.onrender.com
      - key: VITE_APP_URL_UK
        value: https://twiniti-crm-dev-uk.onrender.com
      - key: VITE_ENVIRONMENT_LABEL
        value: Development preview
      - key: VITE_GOOGLE_ANALYTICS_ID
        sync: false

  - type: web
    name: twiniti-billing-gateway-dev
    runtime: node
    plan: free
    region: ohio
    branch: development
