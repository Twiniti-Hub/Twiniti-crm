services:
  - type: web
    name: twiniti-crm-dev-api-us
    runtime: node
    plan: free
    region: virginia
    branch: development
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @twiniti/web build && pnpm --filter @twiniti/api build
    startCommand: pnpm --filter @twiniti/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_ENV
        value: development
      - key: REGION_CODE
        value: us
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL_Dev_US
        sync: false
      - key: REGIONAL_APP_URL
        sync: false
      - key: VITE_GOOGLE_ANALYTICS_ID
        sync: false
      - key: HEXCLAVE_BASE_URL
        sync: false
      - key: HEXCLAVE_PROJECT_ID
        sync: false
      - key: VITE_HEXCLAVE_PROJECT_ID
        sync: false
      - key: VITE_HEXCLAVE_PUBLISHABLE_CLIENT_KEY
        sync: false
      - key: HEXCLAVE_SECRET_SERVER_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_TRACKING_DOMAIN
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_TRIAL_PERIOD_DAYS
        value: "7"
      - key: STRIPE_BILLING_PORTAL_CONFIGURATION_ID
        sync: false
      - key: LICENSE_API_URL
        sync: false
      - key: LICENSE_API_API_KEY
        sync: false
      - key: LICENSE_API_PRODUCT_CODE
        value: twiniti-loop
      - key: LICENSE_API_PLAN_CODE
        value: standard
      - key: LICENSE_API_GRACE_PERIOD_DAYS
        value: "7"
      - key: LICENSE_API_REQUEST_TIMEOUT_MS
        value: "5000"
      - key: LICENSE_API_CACHE_TTL_MS
        value: "15000"
      - key: LICENSE_API_REQUIRED
        value: "true"
      - key: AUTH_DISABLED
        value: "false"
      - key: BOOTSTRAP_ORG_NAME
        sync: false
      - key: BOOTSTRAP_OWNER_SUBJECT
        sync: false

