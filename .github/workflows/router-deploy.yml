name: Deploy Loop router

on:
  push:
    branches: [development]
    paths:
      - "apps/router/**"
      - ".github/workflows/router-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development:
    name: router / development
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.ref == 'refs/heads/development'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy Development router
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not configured; skipping Loop router deploy."
            exit 0
          fi
          pnpm --filter @twiniti/router test
          pnpm --filter @twiniti/router exec wrangler deploy
